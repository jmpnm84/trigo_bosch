<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scanner Manual</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 20px; background: #000; color: #fff; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 900px; background: #1a1a1a; padding: 40px; border-radius: 20px; text-align: center; }
        h2 { font-size: 2em; color: #ccc; }
        input { padding: 30px; font-size: 40px; width: 100%; border: 4px solid #444; border-radius: 15px; text-align: center; box-sizing: border-box; background: #000; color: #fff; }
        table { width: 100%; max-width: 900px; margin-top: 40px; border-collapse: collapse; background: #1a1a1a; font-size: 20px; }
        th, td { border: 2px solid #333; padding: 15px; text-align: center; }
        th { background: #333; }
        .val-frio { color: #007bff; font-weight: bold; }
        .val-quente { color: #dc3545; font-weight: bold; }
        .btn-export { background-color: #28a745; width: 100%; max-width: 900px; margin-top: 20px; padding: 25px; font-size: 25px; border-radius: 15px; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>

    <div class="container">
        <h2 id="instrucao">Picar Código (Scanner)</h2>
        <input type="text" id="main-input" autocomplete="off" autofocus>
    </div>

    <table id="tabela-dados">
        <thead><tr><th>Código</th><th>Frio</th><th>Quente</th></tr></thead>
        <tbody id="tabela-corpo" onclick="confirmarExclusao(event)"></tbody>
    </table>

    <button class="btn-export" onclick="exportarExcel()">EXPORTAR PARA EXCEL</button>

    <script>
        const input = document.getElementById('main-input');
        const instrucao = document.getElementById('instrucao');
        
        let etapa = 0; 
        let dados = { codigo: '', frio: '', quente: '' };

        input.addEventListener("keydown", (event) => {
            if (event.key === "Enter" && input.value.trim() !== "") {
                const valor = input.value.trim();
                
                if (etapa === 0) {
                    dados.codigo = valor;
                    instrucao.innerText = "Digite o valor FRIO (Manual)";
                    input.inputMode = "decimal"; // Abre teclado numérico
                    input.style.borderColor = "#007bff";
                    etapa = 1;
                } else if (etapa === 1) {
                    dados.frio = valor;
                    instrucao.innerText = "Digite o valor QUENTE (Manual)";
                    input.style.borderColor = "#dc3545";
                    etapa = 2;
                } else if (etapa === 2) {
                    dados.quente = valor;
                    adicionarLinha();
                    // Reset
                    dados = { codigo: '', frio: '', quente: '' };
                    etapa = 0;
                    instrucao.innerText = "Picar Código (Scanner)";
                    input.inputMode = "text";
                    input.style.borderColor = "#444";
                }
                
                input.value = "";
                input.focus();
            }
        });

        function adicionarLinha() {
            const tabela = document.getElementById('tabela-corpo');
            const row = tabela.insertRow(0);
            row.innerHTML = `<td>${dados.codigo}</td><td class="val-frio">${dados.frio}</td><td class="val-quente">${dados.quente}</td>`;
        }

        function confirmarExclusao(event) {
            if (event.target.tagName === 'TD' && confirm("Eliminar linha?")) event.target.parentNode.remove();
        }

        function exportarExcel() {
            const wb = XLSX.utils.table_to_book(document.getElementById("tabela-dados"), {sheet: "Scanner"});
            XLSX.writeFile(wb, "Relatorio_Scanner.xlsx");
        }
    </script>
</body>
</html>
