<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <title>Scanner Trigo Bosch</title>

    <link rel="manifest" href='data:application/manifest+json,{"name":"Trigo Bosch Scanner","short_name":"Trigo Bosch","start_url":"./","display":"standalone","background_color":"%23000000","theme_color":"%23000000","icons":[{"src":"https://github.com/user-attachments/assets/551468d9-5560-4c73-bd60-2725c64d8476","sizes":"512x512","type":"image/png"}]}'>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <style>
        body { font-family: sans-serif; margin: 0; padding: 10px; background: #000; color: #fff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; box-sizing: border-box; }
        .container { width: 100%; max-width: 600px; background: #1a1a1a; padding: 20px; border-radius: 15px; text-align: center; position: relative; box-sizing: border-box; }
        .versao { position: absolute; top: 10px; right: 15px; font-size: 0.8rem; color: #666; }
        h2 { font-size: 1.5rem; color: #ccc; margin-bottom: 15px; }
        
        input { padding: 20px; font-size: 1.5rem; width: 100%; border: 3px solid #444; border-radius: 10px; text-align: center; box-sizing: border-box; background: #000; color: #fff; outline: none; margin-bottom: 10px; }
        
        .table-wrapper { width: 100%; max-width: 600px; overflow-x: auto; margin-top: 20px; border-radius: 10px; }
        table { width: 100%; border-collapse: collapse; background: #1a1a1a; font-size: 1rem; }
        th, td { border: 1px solid #333; padding: 12px 8px; text-align: center; white-space: nowrap; }
        th { background: #333; }
        
        .val-frio { color: #007bff; font-weight: bold; }
        .val-quente { color: #8b0000; font-weight: bold; } 
        
        .btn-sync { background-color: #0056b3; width: 100%; max-width: 600px; margin-top: 20px; padding: 20px; font-size: 1.2rem; border-radius: 10px; color: white; border: none; cursor: pointer; font-weight: bold; }
        .btn-sync:disabled { background-color: #444; cursor: not-allowed; }
        .btn-export { background-color: #28a745; width: 100%; max-width: 600px; margin-top: 10px; padding: 15px; font-size: 1rem; border-radius: 10px; color: white; border: none; cursor: pointer; }
        
        .paginacao { margin-top: 15px; display: flex; gap: 5px; justify-content: center; flex-wrap: wrap; }
        .paginacao button { padding: 10px 15px; cursor: pointer; border-radius: 5px; border: none; background: #333; color: white; }
        
        #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: #222; padding: 30px; border-radius: 15px; text-align: center; width: 90%; max-width: 400px; }
        .btn-modal { padding: 20px; font-size: 1.5rem; margin: 10px; border: none; border-radius: 10px; cursor: pointer; color: white; font-weight: bold; width: 45%; }
    </style>
</head>
<body>

    <div class="container">
        <div class="versao">v3.4.0</div>
        <h2 id="instrucao">Picar Código (Scanner)</h2>
        <input type="text" id="main-input" autocomplete="off" autofocus>
    </div>

    <div class="table-wrapper">
        <table id="tabela-dados">
            <thead><tr><th>Data/Hora</th><th>Código</th><th>Frio</th><th>Quente</th><th>Status</th></tr></thead>
            <tbody id="tabela-corpo" onclick="confirmarExclusao(event)"></tbody>
        </table>
    </div>
    <div class="paginacao" id="paginacao"></div>

    <button class="btn-sync" id="btn-sincronizar" onclick="sincronizarTodoHistorico()">SINCRONIZAR TODO O HISTÓRICO ☁️</button>
    
    <button class="btn-export" onclick="exportarExcel()">Exportar Backup para Excel (Local)</button>

    <div id="modal">
        <div class="modal-content">
            <h2 id="modal-titulo">Resultado?</h2>
            <button class="btn-modal" style="background: #28a745;" onclick="finalizar(true)">OK</button>
            <button class="btn-modal" style="background: #dc3545;" onclick="finalizar(false)">NOK</button>
        </div>
    </div>

    <script>
        const GOOGLE_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxiv6W3XqrV50aMyrvP6utQyDZ16dWaz7_c5ixE8Xo-CqS257mmZaSHnS_qpDvFQ47EKw/exec";

        let listaDados = JSON.parse(localStorage.getItem('scannerDados')) || [];
        let paginaAtual = 1;
        const itensPorPagina = 10;

        const input = document.getElementById('main-input');
        const instrucao = document.getElementById('instrucao');
        const modal = document.getElementById('modal');
        const btnSincronizar = document.getElementById('btn-sincronizar');
        let etapa = 0; 
        let dados = { dataHora: '', codigo: '', frio: '', quente: '' };

        function renderizarTabela() {
            const corpo = document.getElementById('tabela-corpo');
            corpo.innerHTML = '';
            
            const inicio = (paginaAtual - 1) * itensPorPagina;
            const fim = inicio + itensPorPagina;
            const paginado = listaDados.slice(inicio, fim);

            paginado.forEach((item) => {
                const realIndex = listaDados.indexOf(item);
                const row = corpo.insertRow();
                row.innerHTML = `<td style="display:none">${realIndex}</td><td>${item.dataHora || ''}</td><td>${item.codigo}</td><td class="val-frio">${item.frio}</td><td class="val-quente">${item.quente}</td><td style="color:${item.status === 'OK' ? '#28a745' : '#dc3545'}; font-weight:bold;">${item.status}</td>`;
            });
            renderizarPaginacao(listaDados.length);
        }

        function renderizarPaginacao(totalItens) {
            const pagDiv = document.getElementById('paginacao');
            pagDiv.innerHTML = '';
            const totalPaginas = Math.ceil(totalItens / itensPorPagina);
            for(let i=1; i<=totalPaginas; i++) {
                const btn = document.createElement('button');
                btn.innerText = i;
                btn.className = (i === paginaAtual) ? "active" : "";
                btn.onclick = () => { paginaAtual = i; renderizarTabela(); };
                pagDiv.appendChild(btn);
            }
        }

        input.addEventListener("keydown", (event) => {
            if (event.key === "Enter" && input.value.trim() !== "") {
                const valor = input.value.trim();
                if (etapa === 0) { 
                    if (listaDados.some(item => item.codigo === valor)) {
                        alert("Este código já foi registrado!");
                        input.value = "";
                        return;
                    }
                    dados.codigo = valor; 
                    instrucao.innerText = "Digite o valor FRIO"; 
                    input.style.borderColor = "#007bff"; 
                    etapa = 1; 
                } 
                else if (etapa === 1) { dados.frio = valor; instrucao.innerText = "Digite o valor QUENTE"; input.style.borderColor = "#8b0000"; etapa = 2; } 
                else if (etapa === 2) { dados.quente = valor; input.blur(); modal.style.display = "flex"; }
                input.value = "";
            }
        });

        function finalizar(status) {
            modal.style.display = "none";
            
            // Captura a data e hora atual do sistema local
            const agora = new Date();
            dados.dataHora = agora.toLocaleString('pt-PT');

            const novoItem = { ...dados, status: status ? "OK" : "NOK" };
            
            listaDados.unshift(novoItem);
            localStorage.setItem('scannerDados', JSON.stringify(listaDados));
            renderizarTabela();
            
            enviarParaGoogleDrive([novoItem]);

            dados = { dataHora: '', codigo: '', frio: '', quente: '' };
            etapa = 0;
            instrucao.innerText = "Picar Código (Scanner)";
            input.style.borderColor = "#444";
            input.focus();
        }

        function enviarParaGoogleDrive(arrayDados) {
            exibirAvisoTemporario("Sincronizando... ⏳", "#ffc107");
            
            return fetch(GOOGLE_WEB_APP_URL, {
                method: "POST",
                mode: "no-cors", 
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(arrayDados)
            })
            .then(() => {
                console.log("Sincronização concluída.");
                exibirAvisoTemporario("Sincronizado com sucesso! ✅", "#28a745");
            })
            .catch(error => {
                console.error("Erro na sincronização:", error);
                exibirAvisoTemporario("Erro ao salvar online! ❌", "#dc3545");
                throw error;
            });
        }

        function sincronizarTodoHistorico() {
            if (listaDados.length === 0) {
                alert("Não existem dados no histórico local para exportar!");
                return;
            }

            if (!confirm(`Deseja exportar e acumular todos os ${listaDados.length} registos no Google Drive?`)) {
                return;
            }

            btnSincronizar.disabled = true;
            btnSincronizar.innerText = "A ENVIAR HISTÓRICO... POR FAVOR AGUARDE";
            exibirAvisoTemporario("A exportar histórico completo... ☁️", "#007bff");

            enviarParaGoogleDrive(listaDados)
                .then(() => {
                    alert("Todo o histórico foi exportado e acumulado no Google Drive com sucesso!");
                })
                .catch(error => {
                    alert("Ocorreu um erro ao enviar alguns registos. Verifique a ligação.");
                })
                .finally(() => {
                    btnSincronizar.disabled = false;
                    btnSincronizar.innerText = "SINCRONIZAR TODO O HISTÓRICO ☁️";
                });
        }

        function exibirAvisoTemporario(texto, cor) {
            const corOriginal = instrucao.style.color;
            instrucao.innerText = texto;
            instrucao.style.color = cor;
            
            setTimeout(() => {
                if (etapa === 0 && (instrucao.innerText === texto)) {
                    instrucao.innerText = "Picar Código (Scanner)";
                    instrucao.style.color = corOriginal;
                }
            }, 3500);
        }

        function confirmarExclusao(event) {
            if (event.target.tagName === 'TD' && confirm("Eliminar linha do histórico local?")) {
                const index = parseInt(event.target.parentNode.cells[0].innerText);
                listaDados.splice(index, 1);
                localStorage.setItem('scannerDados', JSON.stringify(listaDados));
                renderizarTabela();
            }
        }

        function exportarExcel() {
            const ws = XLSX.utils.json_to_sheet(listaDados);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Scanner");
            XLSX.writeFile(wb, "Relatorio_Scanner_Backup.xlsx");
        }

        renderizarTabela();
    </script>
</body>
</html>
