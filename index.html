<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <title>Scanner Trigo Bosch</title>

    <link rel="manifest" href='data:application/manifest+json,{"name":"Trigo Bosch Scanner","short_name":"Trigo Bosch","start_url":"./","display":"standalone","background_color":"%23000000","theme_color":"%23000000","icons":[{"src":"https://github.com/user-attachments/assets/78790071-93f2-4de7-8db4-dcb8cc28b45b","sizes":"512x512","type":"image/png"}]}'>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <style>
        body { font-family: sans-serif; margin: 0; padding: 20px; background: #000; color: #fff; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 900px; background: #1a1a1a; padding: 40px; border-radius: 20px; text-align: center; position: relative; }
        .versao { position: absolute; top: 10px; right: 20px; font-size: 14px; color: #666; }
        h2 { font-size: 2em; color: #ccc; margin-bottom: 20px; }
        input { padding: 30px; font-size: 40px; width: 100%; border: 4px solid #444; border-radius: 15px; text-align: center; box-sizing: border-box; background: #000; color: #fff; outline: none; }
        table { width: 100%; max-width: 900px; margin-top: 40px; border-collapse: collapse; background: #1a1a1a; font-size: 20px; }
        th, td { border: 2px solid #333; padding: 15px; text-align: center; }
        th { background: #333; }
        .val-frio { color: #007bff; font-weight: bold; }
        .val-quente { color: #8b0000; font-weight: bold; } 
        .btn-export { background-color: #28a745; width: 100%; max-width: 900px; margin-top: 20px; padding: 25px; font-size: 25px; border-radius: 15px; color: white; border: none; cursor: pointer; }
        .paginacao { margin-top: 10px; }
        
        #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: #222; padding: 40px; border-radius: 20px; text-align: center; }
        .btn-modal { padding: 30px 60px; font-size: 30px; margin: 10px; border: none; border-radius: 15px; cursor: pointer; color: white; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <div class="versao">v1.0.0</div>
        <h2 id="instrucao">Picar Código (Scanner)</h2>
        <input type="text" id="main-input" autocomplete="off" autofocus>
    </div>

    <table id="tabela-dados">
        <thead><tr><th>Código</th><th>Frio</th><th>Quente</th><th>Status</th></tr></thead>
        <tbody id="tabela-corpo" onclick="confirmarExclusao(event)"></tbody>
    </table>
    <div class="paginacao" id="paginacao"></div>

    <button class="btn-export" onclick="exportarExcel()">EXPORTAR PARA EXCEL</button>

    <div id="modal">
        <div class="modal-content">
            <h2 id="modal-titulo">Resultado?</h2>
            <button class="btn-modal" style="background: #28a745;" onclick="finalizar(true)">OK</button>
            <button class="btn-modal" style="background: #dc3545;" onclick="finalizar(false)">NOK</button>
        </div>
    </div>

    <script>
        let listaDados = JSON.parse(localStorage.getItem('scannerDados')) || [];
        let paginaAtual = 1;
        const itensPorPagina = 10;

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register(new Blob([`
                self.addEventListener('fetch', (event) => {
                    event.respondWith(caches.match(event.request).then(res => res || fetch(event.request)));
                });
            `], {type: 'application/javascript'}));
        }

        const input = document.getElementById('main-input');
        const instrucao = document.getElementById('instrucao');
        const modal = document.getElementById('modal');
        let etapa = 0; 
        let dados = { codigo: '', frio: '', quente: '' };

        function renderizarTabela() {
            const corpo = document.getElementById('tabela-corpo');
            corpo.innerHTML = '';
            const inicio = (paginaAtual - 1) * itensPorPagina;
            const fim = inicio + itensPorPagina;
            const paginado = listaDados.slice(inicio, fim);

            paginado.forEach((item, index) => {
                const row = corpo.insertRow();
                row.innerHTML = `<td style="display:none">${inicio + index}</td><td>${item.codigo}</td><td class="val-frio">${item.frio}</td><td class="val-quente">${item.quente}</td><td style="color:${item.status === 'OK' ? '#28a745' : '#dc3545'}; font-weight:bold;">${item.status}</td>`;
            });
            renderizarPaginacao();
        }

        function renderizarPaginacao() {
            const pagDiv = document.getElementById('paginacao');
            pagDiv.innerHTML = '';
            const totalPaginas = Math.ceil(listaDados.length / itensPorPagina);
            for(let i=1; i<=totalPaginas; i++) {
                const btn = document.createElement('button');
                btn.innerText = i;
                btn.style.margin = "5px";
                btn.onclick = () => { paginaAtual = i; renderizarTabela(); };
                pagDiv.appendChild(btn);
            }
        }

        input.addEventListener("keydown", (event) => {
            if (event.key === "Enter" && input.value.trim() !== "") {
                const valor = input.value.trim();
                if (etapa === 0) { dados.codigo = valor; instrucao.innerText = "Digite o valor FRIO"; input.style.borderColor = "#007bff"; etapa = 1; } 
                else if (etapa === 1) { dados.frio = valor; instrucao.innerText = "Digite o valor QUENTE"; input.style.borderColor = "#8b0000"; etapa = 2; } 
                else if (etapa === 2) { dados.quente = valor; input.blur(); modal.style.display = "flex"; }
                input.value = "";
            }
        });

        function finalizar(status) {
            modal.style.display = "none";
            listaDados.unshift({ ...dados, status: status ? "OK" : "NOK" });
            localStorage.setItem('scannerDados', JSON.stringify(listaDados));
            renderizarTabela();
            dados = { codigo: '', frio: '', quente: '' };
            etapa = 0;
            instrucao.innerText = "Picar Código (Scanner)";
            input.style.borderColor = "#444";
            input.focus();
        }

        function confirmarExclusao(event) {
            if (event.target.tagName === 'TD' && confirm("Eliminar linha?")) {
                const index = parseInt(event.target.parentNode.cells[0].innerText);
                listaDados.splice(index, 1);
                localStorage.setItem('scannerDados', JSON.stringify(listaDados));
                renderizarTabela();
            }
        }

        function exportarExcel() {
            const ws = XLSX.utils.json_to_sheet(listaDados);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Scanner");
            XLSX.writeFile(wb, "Relatorio_Scanner.xlsx");
        }

        renderizarTabela();
    </script>
</body>
</html>
